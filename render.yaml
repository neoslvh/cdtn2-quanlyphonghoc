services:
  - type: web
    name: qlphong
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qlphong-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads

databases:
  - name: qlphong-db
    plan: free
    region: singapore
    databaseName: qlphong
    user: qlphong
