name: CI

# Chạy cho mọi pull request vào staging hoặc main và mỗi lần gộp vào hai nhánh này.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (kiểm thử API)
    runs-on: ubuntu-latest
    # PostgreSQL thật cho test tích hợp: migration, ràng buộc cơ sở dữ liệu và truy cập đồng thời.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qlphong
          POSTGRES_USER: qlphong
          POSTGRES_PASSWORD: qlphong_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qlphong -d qlphong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qlphong:qlphong_dev@localhost:5432/qlphong
      RUN_PG_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - run: npm test

  frontend:
    name: Frontend (build giao diện)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  jira-script:
    name: Script Jira (kiểm thử)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts
