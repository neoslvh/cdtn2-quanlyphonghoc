name: Claude review

# Mỗi pull request vào staging được Claude review. Đạt thì tự gộp (squash) sau khi CI xanh,
# không đạt thì dừng lại, ghi rõ chỗ lỗi, lý do và cách sửa lên PR.
# Cần secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions). Thiếu secret thì job tự bỏ qua.
# Dán nhãn no-auto-merge lên PR để Claude chỉ review, không tự gộp.
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  review:
    name: Claude review và tự gộp
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Kiểm tra khóa API
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Chưa có secret ANTHROPIC_API_KEY, bỏ qua Claude review."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Claude review
        id: review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} của kho ${{ github.repository }} (nhánh ${{ github.head_ref }} vào ${{ github.base_ref }}).
            Đọc CLAUDE.md và CONTRIBUTING.md trước. Xem diff bằng `gh pr diff ${{ github.event.pull_request.number }}`, đọc các tệp liên quan trong mã nguồn khi cần, và xem thông điệp commit bằng `git log origin/${{ github.base_ref }}..HEAD --format=%B`.

            Chỉ tính là "blocker" (chặn gộp) khi có một trong các lỗi sau: lỗi logic hoặc crash; lỗ hổng bảo mật (thiếu kiểm tra dữ liệu đầu vào, thiếu phân quyền ở máy chủ, lộ mật khẩu, khóa bí mật, tệp .env); sửa lại migration đã có thay vì thêm migration mới; thay đổi hành vi mà không có kiểm thử cho nhánh xử lý mới; làm hỏng build hoặc kiểm thử; commit hoặc mô tả PR có dòng Co-Authored-By hay "Generated with" ghi công cho Claude hoặc Anthropic.
            Những điểm còn lại (đặt tên, cấu trúc, tài liệu, tối ưu, đề xuất cải thiện) là "suggestion", không chặn gộp.
            Không bịa lỗi. Nếu không có blocker thì verdict là approve.

            Với mỗi finding, ghi rõ: tệp và dòng, vấn đề là gì, vì sao là vấn đề (giải thích để người mới hiểu), và cách sửa cụ thể (có đoạn mã mẫu nếu ngắn). Viết tiếng Việt có dấu, văn phong tự nhiên, không emoji. Không sửa mã, không đăng bình luận, chỉ trả về kết quả theo schema.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["blocker","suggestion"]},"file":{"type":"string"},"line":{"type":"integer"},"problem":{"type":"string"},"why":{"type":"string"},"fix":{"type":"string"}},"required":["severity","problem","why","fix"]}}},"required":["verdict","summary","findings"]}'

      - name: Quyết định và gộp
        if: steps.gate.outputs.ok == 'true' && steps.review.outputs.structured_output != ''
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          BLOCKERS=$(jq '[.findings[] | select(.severity=="blocker")] | length' <<<"$RESULT")
          VERDICT=$(jq -r '.verdict' <<<"$RESULT")
          OUTCOME=""
          if [ "$VERDICT" != "approve" ] || [ "$BLOCKERS" -gt 0 ]; then
            OUTCOME="**Chưa gộp.** Có điểm cần sửa trước khi gộp, xem bên dưới. Sửa xong chỉ cần đẩy commit mới, Claude sẽ review lại."
            echo "BLOCKED=1" >> "$GITHUB_ENV"
          elif [[ ",$LABELS," == *",no-auto-merge,"* ]]; then
            OUTCOME="Review đạt, nhưng PR có nhãn \`no-auto-merge\` nên không tự gộp. Người phụ trách gộp thủ công."
          else
            # Chờ hai kiểm tra của CI (workflow khác) trên đúng commit này.
            STATE=pending
            for i in $(seq 1 60); do
              RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq '[.check_runs[] | select(.name | startswith("Backend") or startswith("Frontend"))]')
              TOTAL=$(jq 'length' <<<"$RUNS")
              if jq -e 'any(.[]; .status=="completed" and .conclusion!="success" and .conclusion!="skipped")' <<<"$RUNS" >/dev/null; then STATE=failed; break; fi
              if [ "$TOTAL" -ge 2 ] && jq -e 'all(.[]; .status=="completed")' <<<"$RUNS" >/dev/null; then STATE=passed; break; fi
              sleep 15
            done
            if [ "$STATE" = passed ]; then
              if ERR=$(gh pr merge "$PR" --squash --delete-branch --subject "$TITLE (#$PR)" 2>&1); then
                OUTCOME="**Đã tự gộp vào \`staging\`** (squash) vì review đạt và CI xanh."
              else
                OUTCOME="Review đạt và CI xanh nhưng chưa gộp được: \`$ERR\`. Người phụ trách gộp thủ công."
                echo "BLOCKED=1" >> "$GITHUB_ENV"
              fi
            elif [ "$STATE" = failed ]; then
              OUTCOME="Review đạt nhưng CI chưa đạt nên chưa gộp. Xem tab Checks của PR."
              echo "BLOCKED=1" >> "$GITHUB_ENV"
            else
              OUTCOME="Review đạt nhưng CI chưa xong sau 15 phút nên chưa gộp. Chạy lại job sau khi CI hoàn tất."
              echo "BLOCKED=1" >> "$GITHUB_ENV"
            fi
          fi
          {
            echo "<!-- claude-review -->"
            echo "## Kết quả review của Claude"
            echo
            echo "$OUTCOME"
            echo
            jq -r '.summary' <<<"$RESULT"
            echo
            jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" '
              def where: if .file then "[`\(.file)\(if .line then ":\(.line)" else "" end)`](https://github.com/\($repo)/blob/\($sha)/\(.file)\(if .line then "#L\(.line)" else "" end))" else "Chung" end;
              def block($sev; $title):
                ([.findings[] | select(.severity==$sev)]) as $f
                | if ($f|length)==0 then empty else
                    "### \($title)\n",
                    ($f | to_entries[] | "\(.key+1). \(.value | where)\n   - Vấn đề: \(.value.problem)\n   - Vì sao: \(.value.why)\n   - Cách sửa: \(.value.fix)\n")
                  end;
              block("blocker"; "Cần sửa trước khi gộp"),
              block("suggestion"; "Gợi ý, không chặn gộp")' <<<"$RESULT"
          } > body.md
          gh pr comment "$PR" --body-file body.md --edit-last --create-if-none

      - name: Báo lỗi nếu bị chặn
        if: env.BLOCKED == '1'
        run: |
          echo "::error::Claude review chưa cho gộp, xem bình luận trên PR."
          exit 1
