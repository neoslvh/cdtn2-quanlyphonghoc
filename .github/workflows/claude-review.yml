name: Claude review

# Mỗi pull request vào staging được Claude review và gắn một trong ba trạng thái:
#   BLOCKED  có lỗi thật, chặn gộp, kèm giải thích và hướng sửa.
#   SUGGEST  không có lỗi, chỉ có gợi ý tối ưu hoặc nâng cao. Không chặn gộp.
#   OK       không có gì cần nói thêm.
# BLOCKED thì dừng lại. SUGGEST và OK thì tự gộp (squash) sau khi CI xanh.
# Dán nhãn no-auto-merge lên PR để Claude chỉ review, không tự gộp (dùng khi muốn sửa gợi ý trước).
# Cần secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions). Thiếu secret thì job tự bỏ qua.
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  review:
    name: Claude review và tự gộp
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Kiểm tra khóa API
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Chưa có secret ANTHROPIC_API_KEY, bỏ qua Claude review."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Claude review
        id: review
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} của kho ${{ github.repository }} (nhánh ${{ github.head_ref }} vào ${{ github.base_ref }}).
            Đọc CLAUDE.md và CONTRIBUTING.md trước. Xem diff bằng `gh pr diff ${{ github.event.pull_request.number }}`, đọc các tệp liên quan khi cần, và xem thông điệp commit bằng `git log origin/${{ github.base_ref }}..HEAD --format=%B`.

            Mỗi finding thuộc đúng một trong hai loại.

            "blocker" (BLOCKED, chặn gộp) chỉ dành cho lỗi thật: lỗi logic hoặc crash; lỗ hổng bảo mật (thiếu kiểm tra dữ liệu đầu vào, thiếu phân quyền ở máy chủ, lộ mật khẩu, khóa bí mật, tệp .env); sửa lại migration đã có thay vì thêm migration mới; làm hỏng build hoặc kiểm thử; hành vi mới không có kiểm thử; commit hoặc mô tả PR có dòng Co-Authored-By hay "Generated with" ghi công Claude hoặc Anthropic.

            "suggestion" (SUGGEST, không chặn gộp) dành cho code vẫn chạy đúng nhưng có thể tốt hơn: dùng thư viện hoặc tính năng có sẵn xịn hơn, tối ưu hiệu năng, gọn hơn, an toàn hơn ở mức nâng cao, dễ bảo trì hơn, thêm kiểm thử, cải thiện trải nghiệm. Không đưa những điều nhỏ nhặt về cách đặt tên hay định dạng.

            Không bịa lỗi. Không có gì đáng nói thì trả về danh sách findings rỗng.

            Văn phong: tiếng Việt có dấu, ngắn gọn, đơn giản đến mức người mới học cũng hiểu, không emoji, không mở đầu dài, không nhắc lại những gì đã đúng. Tối đa 3 blocker và 5 suggestion, chọn những điểm có giá trị nhất. Mỗi finding: problem tối đa 2 câu nói rõ lỗi hoặc ý tưởng là gì, why tối đa 2 câu nói vì sao quan trọng, fix nói cách làm ngắn gọn (nếu có mã mẫu thì không quá 6 dòng). summary tối đa 2 câu.
            Không sửa mã, không đăng bình luận, chỉ trả về kết quả theo schema.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["blocker","suggestion"]},"file":{"type":"string"},"line":{"type":"integer"},"problem":{"type":"string"},"why":{"type":"string"},"fix":{"type":"string"}},"required":["severity","problem","why","fix"]}}},"required":["summary","findings"]}'

      - name: Quyết định, gắn trạng thái và gộp
        if: steps.gate.outputs.ok == 'true' && steps.review.outputs.structured_output != ''
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          BLOCKERS=$(jq '[.findings[] | select(.severity=="blocker")] | length' <<<"$RESULT")
          SUGGESTS=$(jq '[.findings[] | select(.severity=="suggestion")] | length' <<<"$RESULT")
          if [ "$BLOCKERS" -gt 0 ]; then STATUS=BLOCKED
          elif [ "$SUGGESTS" -gt 0 ]; then STATUS=SUGGEST
          else STATUS=OK; fi

          # Nhãn trạng thái để nhìn thấy ngay ở danh sách PR.
          gh label create claude:blocked --color D73A4A --description "Claude review: có lỗi, chặn gộp" 2>/dev/null || true
          gh label create claude:suggest --color FBCA04 --description "Claude review: có gợi ý, không chặn gộp" 2>/dev/null || true
          gh label create claude:ok --color 0E8A16 --description "Claude review: đạt" 2>/dev/null || true
          LOW=$(echo "$STATUS" | tr 'A-Z' 'a-z')
          for L in blocked suggest ok; do
            if [ "$L" = "$LOW" ]; then gh pr edit "$PR" --add-label "claude:$L" || true; else gh pr edit "$PR" --remove-label "claude:$L" 2>/dev/null || true; fi
          done

          HOLD=0
          [[ ",$LABELS," == *",no-auto-merge,"* ]] && HOLD=1
          if [ "$STATUS" = BLOCKED ]; then
            OUTCOME="**Chặn gộp.** Sửa các lỗi bên dưới rồi đẩy commit mới, Claude sẽ review lại."
            echo "BLOCKED=1" >> "$GITHUB_ENV"
          elif [ "$HOLD" = 1 ]; then
            OUTCOME="**Chưa gộp** vì PR có nhãn \`no-auto-merge\`. Sửa gợi ý nếu muốn (hoặc bỏ qua), rồi gỡ nhãn và đóng mở lại PR hoặc đẩy commit mới để Claude review lại và tự gộp."
          else
            # Chờ hai kiểm tra của CI (workflow khác) trên đúng commit này.
            CI=pending
            for i in $(seq 1 60); do
              RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq '[.check_runs[] | select(.name | startswith("Backend") or startswith("Frontend"))]')
              TOTAL=$(jq 'length' <<<"$RUNS")
              if jq -e 'any(.[]; .status=="completed" and .conclusion!="success" and .conclusion!="skipped")' <<<"$RUNS" >/dev/null; then CI=failed; break; fi
              if [ "$TOTAL" -ge 2 ] && jq -e 'all(.[]; .status=="completed")' <<<"$RUNS" >/dev/null; then CI=passed; break; fi
              sleep 15
            done
            if [ "$CI" = passed ]; then
              if ERR=$(gh pr merge "$PR" --squash --delete-branch --subject "$TITLE (#$PR)" 2>&1); then
                if [ "$STATUS" = SUGGEST ]; then
                  OUTCOME="**Đã tự gộp vào \`staging\`** (squash). Gợi ý bên dưới không bắt buộc, có thể làm ở PR sau."
                else
                  OUTCOME="**Đã tự gộp vào \`staging\`** (squash)."
                fi
              else
                OUTCOME="Review đạt, CI xanh nhưng chưa gộp được: \`$ERR\`. Người phụ trách gộp thủ công."
                echo "BLOCKED=1" >> "$GITHUB_ENV"
              fi
            elif [ "$CI" = failed ]; then
              OUTCOME="Review đạt nhưng CI chưa đạt nên chưa gộp. Xem tab Checks của PR."
              echo "BLOCKED=1" >> "$GITHUB_ENV"
            else
              OUTCOME="Review đạt nhưng CI chưa xong sau 15 phút nên chưa gộp. Chạy lại job sau khi CI hoàn tất."
              echo "BLOCKED=1" >> "$GITHUB_ENV"
            fi
          fi

          {
            echo "<!-- claude-review -->"
            echo "## Claude review: $STATUS"
            echo
            echo "$OUTCOME"
            echo
            jq -r '.summary' <<<"$RESULT"
            echo
            jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" '
              def where: if .file then "[`\(.file)\(if .line then ":\(.line)" else "" end)`](https://github.com/\($repo)/blob/\($sha)/\(.file)\(if .line then "#L\(.line)" else "" end))" else "Chung" end;
              def block($sev; $title; $a; $b; $c):
                ([.findings[] | select(.severity==$sev)]) as $f
                | if ($f|length)==0 then empty else
                    "### \($title)\n",
                    ($f | to_entries[] | "\(.key+1). \(.value | where)\n   - \($a): \(.value.problem)\n   - \($b): \(.value.why)\n   - \($c): \(.value.fix)\n")
                  end;
              block("blocker"; "Lỗi cần sửa (chặn gộp)"; "Lỗi"; "Vì sao"; "Cách sửa"),
              block("suggestion"; "Gợi ý (không chặn gộp)"; "Gợi ý"; "Lợi ích"; "Cách làm")' <<<"$RESULT"
          } > body.md
          gh pr comment "$PR" --body-file body.md --edit-last --create-if-none

      - name: Báo lỗi nếu bị chặn
        if: env.BLOCKED == '1'
        run: |
          echo "::error::Claude review chưa cho gộp, xem bình luận trên PR."
          exit 1
