server {
  listen 80;
  server_tokens off;

  # CSP chỉ cho phép tài nguyên cùng nguồn và Google Fonts (phông Plus Jakarta Sans). Ant Design cần style nội tuyến.
  # img-src có blob: vì ảnh mã QR tải kèm token rồi hiện bằng URL blob.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json;

  location /api/ {
    # Tệp đính kèm và thời khóa biểu tối đa 5 MB, nginx mặc định chỉ cho 1 MB.
    client_max_body_size 6m;
    proxy_pass http://api:3000;
    # Giữ cả cổng để đường dẫn trong mã QR (FR-05) trỏ đúng địa chỉ người dùng đang mở.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
